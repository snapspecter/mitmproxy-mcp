name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs opt into more only when needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check (non-blocking ratchet)
        continue-on-error: true
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=mitmproxy_mcp
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-fail-under=49
          -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  lockfile-consistency:
    name: Lockfile consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: requirements.txt must match uv.lock
        run: |
          # requirements.txt is generated from uv.lock. A Dependabot PR once
          # bumped it to a version the lock could not resolve, so the file
          # silently misrepresented the environment. Fail if they disagree.
          uv export --format requirements-txt -o /tmp/requirements.expected
          # Compare past the two-line autogenerated header (the second line
          # embeds the output filename and would always differ).
          if ! diff -q <(tail -n +3 requirements.txt) \
                       <(tail -n +3 /tmp/requirements.expected); then
            echo "::error::requirements.txt is out of sync with uv.lock. Run: uv export --format requirements-txt -o requirements.txt"
            diff <(tail -n +3 requirements.txt) \
                 <(tail -n +3 /tmp/requirements.expected) || true
            exit 1
          fi

      - name: requirements.txt must be resolvable
        run: |
          # Catches a file that is lock-consistent by hash but unsatisfiable as
          # a set (e.g. a transitive pin conflicting with a direct requirement).
          # An isolated venv is required: uv pip install refuses to run without
          # one, and the project venv must not be touched.
          uv venv /tmp/resolve-check --python 3.12
          VIRTUAL_ENV=/tmp/resolve-check uv pip install --dry-run --no-cache \
            -r requirements.txt

  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: uv run --with twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
