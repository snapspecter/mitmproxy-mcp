[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitmproxy-mcp"
version = "0.6.1"
description = "MITM proxy manager with MCP integration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{ name = "SnapSpecter", email = "snapspecter@outlook.com" }]
keywords = ["mitmproxy", "mcp", "proxy", "http", "debugging", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mitmproxy>=12.0.0",
    "curl-cffi>=0.14.0",
    "mcp>=1.25.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "jsonpath-ng>=1.8.0",
    "beautifulsoup4>=4.14.3",
    "playwright>=1.58.0",
    "google-re2>=1.1",
]

[project.urls]
Homepage = "https://github.com/snapspecter/mitmproxy-mcp"
Repository = "https://github.com/snapspecter/mitmproxy-mcp"
Issues = "https://github.com/snapspecter/mitmproxy-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
security = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
mitmproxy-mcp = "mitmproxy_mcp.core.server:start"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
mitmproxy_mcp = ["templates/*.jinja2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Security floors for transitive dependencies. These are not direct deps, but
# pip-audit flags earlier versions with known advisories, so we pin the fixed
# release as a constraint.
#
# tornado is deliberately absent: mitmproxy pins `tornado<=6.5.5` on every
# released version, so the fixed 6.5.8 cannot be selected. The advisories are
# recorded in .pip-audit-ignore.toml with a review note; this is an upstream
# blocker, not a choice.
constraint-dependencies = [
    "starlette>=1.1.0",
    "werkzeug>=3.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
branch = true
source = ["mitmproxy_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# High-signal, low-noise gate for CI. Broader rulesets (UP, SIM, RUF, PERF, BLE)
# are intentionally left out until the legacy backlog is cleaned up, then they
# can be enabled as a ratchet.
select = ["E4", "E7", "E9", "W6", "F63", "F7", "F82", "B", "S"]
# Documented deferrals:
#   S101 - asserts are expected in the test suite
#   S108 - hardcoded temp paths only appear in tests
#   S110 - try/except/pass is used for best-effort cleanup paths
#   S608 - SQL uses parameterized values; interpolated fragments are column names
#   S701 - Jinja templates emit code, not HTML, so autoescape is not applicable
    #   S501 - deferred: TLS verification semantics need a dedicated review
    #   B007 - unused loop variables kept for readability in a few call sites
    ignore = ["S101", "S108", "S110", "S608", "S701", "S501", "B007"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B101: asserts are expected in tests, and tests are excluded above.
# B404/B603: subprocess use is limited to the generated curl string helper.
skips = ["B101"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
